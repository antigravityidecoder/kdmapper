name: Advanced KDMapper CI

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Binaries (x64)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: |
        nuget restore kdmapper.sln
      continue-on-error: true

    - name: Compile Executable (Release Configuration)
      run: |
        msbuild kdmapper.sln /p:Configuration=Release /p:Platform=x64 /p:LinkIncremental=false /v:m
      shell: cmd

    - name: Verify Output Files Exist
      run: |
        dir /s /b *.exe
      shell: cmd

    - name: Archive Compiled Binaries
      uses: actions/upload-artifact@v4
      with:
        name: kdmapper-production-build
        path: |
          **/*Release*/*.exe
          !**/obj/**
        if-no-files-found: error
        retention-days: 5
